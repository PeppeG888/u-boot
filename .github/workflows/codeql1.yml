name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '26 4 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        queries: ./.github/codeql-queries/10_taint_tracking.ql

    # Step fondamentale per non far fallire la compilazione
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        # Aggiungiamo libsdl1.2-dev per sdl-config e assicuriamoci di avere tutto
        sudo apt-get install -y libssl-dev bc bison flex libsdl1.2-dev

    - name: Build U-Boot
      run: |
        make sandbox_defconfig
        # Il trucco è aggiungere HOSTCFLAGS="-fcommon" per risolvere il problema di yylloc
        make -j$(nproc) HOSTCFLAGS="-fcommon"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
